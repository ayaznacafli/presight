# Runs the whole stack locally:
#   docker compose up --build   ->  http://localhost:8080
#
# On first boot the API applies the schema and seeds SQLite into a named
# volume, so the data survives `docker compose restart` but a
# `docker compose down -v` gives you a clean directory again.

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: presight/api:local
    container_name: presight-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '4000'
      LOG_LEVEL: info
      DATABASE_PATH: /app/data/presight.sqlite
      CORS_ORIGIN: '*'
      AUTO_MIGRATE: 'true'
      SEED_USER_COUNT: '${SEED_USER_COUNT:-25000}'
      SEED_RANDOM_SEED: '${SEED_RANDOM_SEED:-20260830}'
    volumes:
      - presight-data:/app/data
    ports:
      # Exposed so the OpenAPI docs at /docs and the raw API stay reachable.
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch(`http://127.0.0.1:4000/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: presight/web:local
    container_name: presight-web
    restart: unless-stopped
    depends_on:
      api:
        # Wait for the seed to finish, so the first page load has data.
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  presight-data:
    driver: local
